name: Experimental npm Release

on:
  workflow_dispatch:
    inputs:
      expected-sha:
        description: Optional exact commit SHA for automated dispatches
        type: string
        required: false
      release-notes:
        description: Optional intro above the generated release notes
        type: string
        required: false

permissions: {}

concurrency:
  group: npm-staged-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: luxass/shared-workflows/.github/workflows/reusable-release-npm-staged.yaml@4c92e3b7cddbe8531e23d3e26d8ac5bb7cd4665e # shared-workflows fix/staged-release-polling
    with:
      build: false
      expected-sha: ${{ inputs.expected-sha }}
      release-notes: ${{ inputs.release-notes }}
