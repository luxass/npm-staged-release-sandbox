name: Experimental npm Release

on:
  workflow_dispatch:
    inputs:
      expected-sha:
        description: Optional exact commit SHA for automated dispatches
        type: string
        required: false

permissions: {}

concurrency:
  group: npm-staged-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: luxass/shared-workflows/.github/workflows/reusable-release-npm-staged-workspace.yaml@d6e927ea9afc6b93907d2b9214c002ab03745fcf # luxass/shared-workflows#92
    with:
      expected-sha: ${{ inputs.expected-sha }}
