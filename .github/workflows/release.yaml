name: Experimental npm Release

on:
  # Like a Changesets caller, a push to main releases every version that npm does not serve.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected-sha:
        description: Optional exact commit SHA for automated dispatches
        type: string
        required: false

permissions: {}

concurrency:
  group: npm-staged-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: luxass/shared-workflows/.github/workflows/reusable-release-npm-staged-workspace.yaml@0feb9a18eeece52ee1ecd344942e0a54d04f4ac2 # v0.17.0
    with:
      expected-sha: ${{ inputs.expected-sha }}
