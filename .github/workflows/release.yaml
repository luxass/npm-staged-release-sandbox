name: Experimental npm Release

on:
  workflow_dispatch:
    inputs:
      release-notes:
        description: Optional intro above the generated release notes
        type: string
        required: false

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: luxass/shared-workflows/.github/workflows/reusable-release-npm-staged.yaml@87b02ff37aad68b25add9013c48a5cc43f58aa24 # PR #85
    with:
      build: false
      release-notes: ${{ inputs.release-notes }}
