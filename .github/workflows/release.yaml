name: Experimental npm Release

on:
  # Like a Changesets caller, a push to main releases every version that npm does not serve.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected-sha:
        description: Optional exact commit SHA for automated dispatches
        type: string
        required: false

permissions: {}

concurrency:
  group: npm-staged-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: luxass/shared-workflows/.github/workflows/reusable-release-npm-staged-workspace.yaml@411fe8f8a0a53eab5153356ac5e0f174cd245eb2 # v0.17.1
    with:
      expected-sha: ${{ inputs.expected-sha }}
